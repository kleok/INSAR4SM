# InSAR4SM environment with local Sentinel-1 geocoding (COMPASS/isce3, global coverage, Linux/macOS).
# Includes everything of INSAR4SM_env.yml. COMPASS/isce3 keep numpy, scipy, pandas and xarray at older
# versions than the core environment. Versions are the ones tested with `pytest tests/`.
# Exact Linux build: conda-compass-linux-64.lock
name: insar4sm_compass
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.18
  # InSAR4SM core
  - numpy=1.26.4
  - scipy=1.12.0
  - pandas=2.3.3
  - geopandas=1.1.4
  - shapely=2.2.0
  - pyproj=3.7.2
  - gdal=3.12.3
  - rasterio=1.4.4
  - rioxarray=0.19.0
  - xarray=2025.6.1
  - netcdf4=1.7.5
  - h5py=3.16.0
  - matplotlib=3.11.2
  - joblib=1.6.0
  - tqdm=4.70.1
  # ERA5-Land
  - cdsapi=0.7.7
  - cfgrib=0.9.15.1
  - eccodes=2.50.0
  # NISAR GSLC and OPERA CSLC-S1 (remote windowed reads, NASA Earthdata)
  - earthaccess=0.17.0
  - fsspec=2026.9.0
  - aiohttp=3.14.5
  # Sentinel-1 bursts -> geocoded CSLC with COMPASS (global; isce3 is Linux/macOS only)
  - asf_search=14.1.0
  - burst2safe=2.0.3
  - s1reader=0.2.5
  - compass=0.5.6
  - isce3=0.25.8
  # DEM for the local incidence angle
  - dem_stitcher=3.2.0
  # notebook and tests
  - jupyterlab=4.6.6
  - ipykernel=7.4.0
  - pytest=9.2.0
