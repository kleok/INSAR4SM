# InSAR4SM core environment: NISAR GSLC + Sentinel-1 OPERA CSLC-S1 (North America), no isce3.
# Versions are the ones tested with `pytest tests/`. Exact Linux build: conda-linux-64.lock
name: insar4sm
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.11.18
  # InSAR4SM core
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=3.1.1
  - geopandas=1.2.0
  - shapely=2.2.0
  - pyproj=3.7.2
  - gdal=3.12.3
  - rasterio=1.4.4
  - rioxarray=0.19.0
  - xarray=2026.9.0
  - netcdf4=1.7.5
  - h5py=3.16.0
  - matplotlib=3.11.2
  - joblib=1.6.0
  - tqdm=4.70.1
  # ERA5-Land
  - cdsapi=0.7.7
  - cfgrib=0.9.15.1
  - eccodes=2.50.0
  # NISAR GSLC and OPERA CSLC-S1 (remote windowed reads, NASA Earthdata)
  - earthaccess=0.17.0
  - fsspec=2026.9.0
  - aiohttp=3.14.5
  # DEM for the local incidence angle
  - dem_stitcher=3.2.0
  # notebook and tests
  - jupyterlab=4.6.6
  - ipykernel=7.4.0
  - pytest=9.2.0
